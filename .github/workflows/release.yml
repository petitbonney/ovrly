# Builds the desktop app (Electron, desktop/) per OS, a .dmg per Mac architecture and a Windows installer, and attaches
# them to a GitHub release. Native modules only build on their own OS, hence a runner each.
name: release
on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: macos-15, args: --mac --arm64 }
          - { os: macos-15-intel, args: --mac --x64 }
          - { os: windows-latest, args: --win --x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The app's and its Stream Deck plugin's version are the tag's (v2026.11.0 → 2026.11.0).
      - run: pnpm streamdeck:pack --version ${GITHUB_REF_NAME#v}
      - run: pnpm desktop:build ${{ matrix.args }} -c.extraMetadata.version=${GITHUB_REF_NAME#v}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the notes need the commits and the previous tag
      - uses: actions/download-artifact@v4
        with: { path: installers, merge-multiple: true }
      # The notes list the commits since the previous tag: --generate-notes only reads pull requests.
      - run: |
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          git log --format='- %s' ${previous:+$previous..}HEAD > notes.md
          gh release create ${{ github.ref_name }} installers/* --repo ${{ github.repository }} --notes-file notes.md
        env: { GH_TOKEN: '${{ github.token }}' }
