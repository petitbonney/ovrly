# Runs the tests and builds the UI and docs on each push and pull request, the checks of "Before a pull request".
name: test
on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # the release runs it before building

permissions: { contents: read }

jobs:
  test:
    runs-on: macos-14 # nut.js (Key Press) has no working Linux build, and Ovrly ships for macOS and Windows
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build && pnpm docs:build
