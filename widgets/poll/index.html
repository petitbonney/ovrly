<!doctype html>
<meta charset="utf-8">
<title>Poll</title>
<link rel="stylesheet" href="/widgets/base.css">
<div class="card"><h1 id="title"></h1><div id="rows"></div><div id="total" class="muted"></div></div>
<script type="module">
  import { subscribe, el } from '/widgets/lib.js'
  subscribe(({ config, state }) => {
    const options = config.options
    const votes = Object.values(state.votes)
    document.getElementById('title').textContent = config.title
    document.getElementById('rows').replaceChildren(...options.map((option, i) => {
      const count = votes.filter((v) => v === i).length
      const pct = votes.length ? Math.round((count / votes.length) * 100) : 0
      const bar = el('div', 'bar')
      bar.style.width = `${pct}%`
      return el('div', 'row', bar, el('span', '', `${i + 1}. ${option}`), el('span', '', `${pct}%`))
    }))
    document.getElementById('total').textContent = `${votes.length} vote${votes.length === 1 ? '' : 's'}`
  })
</script>
