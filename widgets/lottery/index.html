<!doctype html>
<meta charset="utf-8">
<title>Lottery</title>
<link rel="stylesheet" href="/widgets/base.css">
<!-- anime.js, three.js and cannon-es, served from node_modules by the server (/vendor). -->
<script type="importmap">
  {
    "imports": {
      "animejs": "/vendor/animejs/index.js",
      "animejs/adapters/three": "/vendor/animejs/adapters/three/index.js",
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/",
      "cannon-es": "/vendor/cannon-es/cannon-es.js"
    }
  }
</script>
<style>
  /* The stage fills the page; its canvases (.fill) too. Pieces made of HTML go on the board: 440px, the size layouts
     are designed at, centered and scaled to fit the page (--k, set below). Canvases draw at the same scale. */
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #stage > *, #board > * { position: absolute; }
  #board { left: 50%; top: 50%; width: 440px; height: 440px; translate: -50% -50%; scale: var(--k, 1); }
  .fill { inset: 0; width: 100%; height: 100%; }
  /* Slot cabinet bulbs: chase while drawing, flash on the win (slots.js). */
  .light { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #ffe08a; box-shadow: 0 0 10px #ffb400; opacity: .35; }
  .light.alt { background: #ffd0e4; box-shadow: 0 0 10px #ff4f8b; }

  /* Wheel */
  /* The wheel is 380px (wheel.js): room for the pin, and for the winner to pop out. */
  /* On the right, pointing left: the winning label reads level next to it. */
  /* A red map pin on the right, its tip in the wheel pointing at the center (wheel.js draws it); it pivots on its head. */
  .wheel-pin { left: 386px; top: 200px; width: 54px; height: 40px; transform-origin: 34px 50%; filter: drop-shadow(0 2px 3px #0006); }
  /* An orange-gold dot in relief on the center: lit from the top left, shaded below. */
  .wheel-hub { left: 210px; top: 210px; width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe2b0, #ffa21f 35%, #d0680a 75%, #8a3f00);
    box-shadow: inset 0 -1.5px 2px #0006, inset 0 1.5px 1.5px #fffa; }

  /* Roulette */
  .roulette-arm { left: 211px; top: 211px; }
  .roulette-ball { width: 18px; height: 18px; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle at 35% 30%, #fff, #ddd 50%, #888); box-shadow: 0 2px 4px #000c; }

  /* Slot */
  .slots-cabinet { left: 20px; top: 10px; width: 340px; height: 420px; border-radius: 30px; background: linear-gradient(160deg, #b51d4a, #5c0c3a);
    box-shadow: 0 12px 30px #000a, inset 0 0 0 4px #ffb400, inset 0 -10px 30px #0006; }
  .slots-window { position: absolute; left: 40px; top: 60px; width: 260px; height: 300px; overflow: hidden; border-radius: 16px; background: #0f0f14;
    box-shadow: inset 0 0 0 3px #000; }
  .slots-window::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(#000d, #0000 30%, #0000 70%, #000d); }
  .slots-strip { position: absolute; left: 0; top: 6px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .slots-tile { flex: none; height: 88px; margin: 0 12px; border-radius: 14px; display: grid; place-items: center; font-size: 30px;
    box-shadow: inset 0 -8px 0 #0004, inset 0 4px 0 #fff4; }
  .slots-payline { position: absolute; top: 196px; width: 0; height: 0; border: 14px solid transparent; filter: drop-shadow(0 0 6px #ffb400); }
  .slots-payline.left { left: 16px; border-left: 20px solid #ffb400; }
  .slots-payline.right { right: 16px; border-right: 20px solid #ffb400; }
  .slots-stick { left: 374px; top: 90px; width: 12px; height: 110px; border-radius: 6px; transform-origin: 50% 100%; background: linear-gradient(90deg, #888, #eee, #888); }
  .slots-knob { left: 362px; top: 66px; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff9db8, #e0144f 55%, #6e0022); box-shadow: 0 3px 8px #0009; }
  .slots-base { left: 360px; top: 196px; width: 40px; height: 30px; border-radius: 8px; background: #2a2a30; }
</style>
<div id="stage"></div>
<script type="module">
  import { engine } from 'animejs'
  import { subscribe, wait } from '/widgets/lib.js'
  import { playMs, choices, palette } from '/widgets/lottery/widget.js'
  import wheel from '/widgets/lottery/wheel.js'
  import roulette from '/widgets/lottery/roulette.js'
  import slots from '/widgets/lottery/slots.js'
  import dice from '/widgets/lottery/dice.js'
  const layouts = { wheel, roulette, slots, dice }
  const stage = document.getElementById('stage')

  // OBS may hide the source: draws keep time with the server instead of pausing.
  engine.pauseOnDocumentHidden = false

  const board = Object.assign(document.createElement('div'), { id: 'board' })

  // Each layout builds itself: canvases in the stage, HTML pieces on the board, drawn at res (device pixels per design
  // px). It returns { play(winner, ms) → anime timeline that ends on the winner, stop(), destroy() }. It is rebuilt when
  // the settings or the options loaded from data change, or the page is resized. The page shows no result text: the winner is in the workflow's data
  // ({{winner}}), for an alert or a chat message to announce it.
  let layout, key, lastSpin = 0, shown
  function build(config) {
    const k = Math.min(innerWidth, innerHeight) / 440 // the board's scale: as big as the page allows
    document.documentElement.style.setProperty('--k', k)
    layout?.destroy()
    stage.replaceChildren()
    board.replaceChildren()
    layout = layouts[config.layout](stage, board, config, k * devicePixelRatio)
    stage.append(board) // over the canvases
    shown = config
  }
  addEventListener('resize', () => shown && build(shown))

  let tl // the draw playing, or played last
  subscribe(({ config: settings, state }) => {
    // The wheel and the slot show their options: their own, or those loaded from data, with the palette's colors. With
    // none loaded yet, one blank option per palette color, to show what the palette looks like (none can win).
    let options = choices(settings, state)
    if (settings.source === 'data' && !options.length) options = palette(settings).map((color) => ({ label: '', color, weight: 1 }))
    const config = ['wheel', 'slots'].includes(settings.layout) ? { ...settings, options } : settings
    if (JSON.stringify(config) !== key) {
      key = JSON.stringify(config)
      build(config)
    }
    if (state.winner < 0 || state.at === lastSpin || state.ended || state.layout !== config.layout) return
    lastSpin = state.at
    const ms = playMs(config)
    const played = Math.min(Math.max(Date.now() - state.at, 0), ms) // a page opened mid-draw catches up
    layout.stop()
    tl = layout.play(state.winner, ms).seek(played)
    return wait(ms - played) // finished once the draw is over
  }, {
    stop: () => tl?.seek(tl.duration), // the draw jumps to its end, on the winner
    cancel: () => layout?.stop(), // the draw freezes where it is
  })
</script>
