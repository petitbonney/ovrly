<!doctype html>
<meta charset="utf-8">
<title>Image/GIF</title>
<link rel="stylesheet" href="/widgets/base.css">
<script type="importmap">{ "imports": { "animejs": "/vendor/animejs/index.js" } }</script>
<style>
  /* The image fits the page, centered, whatever its size. */
  #img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
</style>
<img id="img" alt="">
<script type="module">
  import { animate } from 'animejs'
  import { subscribe, wait } from '/widgets/lib.js'
  import { FADE } from '/widgets/image/widget.js'
  const img = document.getElementById('img')
  let timer, anim, shown = 0 // shown: counts renders, so one still loading its image knows it was replaced
  const fade = (out) => {
    anim?.pause()
    anim = animate(img, { opacity: out ? 0 : [0, 1], duration: FADE, ease: out ? 'inQuad' : 'outQuad' })
  }
  // Stop: the image fades out now; cancel: it disappears at once.
  const end = (out) => {
    shown++
    clearTimeout(timer)
    if (out) return fade(true)
    anim?.pause()
    img.style.opacity = 0
  }
  subscribe(async ({ state, runtime }) => {
    const me = ++shown
    clearTimeout(timer)
    const until = runtime.at + state.duration * 1000
    if (runtime.ended || !runtime.url || until <= Date.now()) return void (img.style.opacity = 0)
    // A new image: hidden until it has loaded, or the previous one would show while it does.
    if (img.getAttribute('src') !== runtime.url) {
      anim?.pause()
      img.style.opacity = 0
      img.src = runtime.url
      await img.decode().catch(() => {})
      if (me !== shown) return
    }
    const left = until - Date.now()
    if (left <= 0) return void (img.style.opacity = 0)
    fade(false)
    timer = setTimeout(() => fade(true), Math.max(left - FADE, 0))
    return wait(left + FADE)
  }, { stop: () => end(true), cancel: () => end(false) })
</script>
