<!doctype html>
<meta charset="utf-8">
<title>Image/GIF</title>
<link rel="stylesheet" href="/widgets/base.css">
<script type="importmap">{ "imports": { "animejs": "/vendor/animejs/index.js" } }</script>
<style>
  /* The image fits the page, centered, whatever its size. */
  #img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
</style>
<img id="img" alt="">
<script type="module">
  import { animate } from 'animejs'
  import { subscribe, wait } from '/widgets/lib.js'
  const img = document.getElementById('img')
  const IN = 300, OUT = 300
  let timer
  const fade = (out) => animate(img, { opacity: out ? [1, 0] : [0, 1], duration: out ? OUT : IN, ease: out ? 'inQuad' : 'outQuad' })
  subscribe(async ({ config, state }) => {
    clearTimeout(timer)
    const left = state.cancelled || !state.url ? 0 : state.at + config.duration * 1000 - Date.now()
    if (left <= 0) return void (img.style.opacity = 0)
    if (img.getAttribute('src') !== state.url) img.src = state.url
    fade(false)
    timer = setTimeout(() => fade(true), Math.max(left - OUT, 0))
    return wait(left + OUT)
  }, () => {
    // Cancel: the image goes out now.
    clearTimeout(timer)
    fade(true)
  })
</script>
