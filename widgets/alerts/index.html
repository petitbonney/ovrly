<!doctype html>
<meta charset="utf-8">
<title>Alerts</title>
<link rel="stylesheet" href="/widgets/base.css">
<style>
  #alert { text-align: center; font-size: 40px; opacity: 0; transform: translateY(-20px); transition: .4s; }
  #alert.on { opacity: 1; transform: none; }
</style>
<div id="alert" class="card"></div>
<script type="module">
  import { subscribe, wait } from '/widgets/lib.js'
  const alert = document.getElementById('alert')
  let timer
  subscribe(({ config, state }) => {
    const left = state.cancelled ? 0 : state.at + config.duration * 1000 - Date.now()
    alert.textContent = state.text
    alert.classList.toggle('on', left > 0)
    clearTimeout(timer)
    if (left > 0) timer = setTimeout(() => alert.classList.remove('on'), left)
    return wait(left + 400) // finished once faded out
  }, () => {
    // Cancel: the alert fades out now.
    clearTimeout(timer)
    alert.classList.remove('on')
  })
</script>
