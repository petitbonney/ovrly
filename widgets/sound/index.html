<!doctype html>
<meta charset="utf-8">
<title>Sound</title>
<script type="importmap">{ "imports": { "animejs": "/vendor/animejs/index.js" } }</script>
<audio id="audio"></audio>
<script type="module">
  import { animate } from 'animejs'
  import { subscribe } from '/widgets/lib.js'
  import { FADE } from '/widgets/sound/widget.js'
  const audio = document.getElementById('audio')
  let current // { resolve, timer } of the sound playing now
  let fading // the fade-out in progress
  const volume = (config) => Math.min(Math.max(config.volume, 0) / 100, 1)

  // Ends the sound playing now (its action finishes), fading it out or stopping it at once.
  const stop = (fade) => {
    if (!current) return
    clearTimeout(current.timer)
    current.resolve()
    current = null
    audio.onended = audio.onerror = null
    if (!fade) return audio.pause()
    const level = { v: audio.volume }
    fading = animate(level, { v: 0, duration: FADE, ease: 'linear', onUpdate: () => (audio.volume = level.v), onComplete: () => audio.pause() })
  }

  subscribe(({ state, runtime, run }) => {
    // Only an action plays, not a settings change or a reload; a volume change applies to the sound playing.
    if (!run || runtime.ended || !runtime.url) {
      if (current) audio.volume = volume(state)
      return
    }
    stop(false)
    fading?.pause()
    audio.volume = volume(state)
    return new Promise((resolve) => {
      current = { resolve }
      audio.src = runtime.url
      audio.onended = audio.onerror = () => stop(false)
      // OBS plays without a click; a plain browser tab may refuse, which ends the action at once.
      audio.play().then(() => {
        if (current?.resolve === resolve && state.duration > 0) current.timer = setTimeout(() => stop(true), state.duration * 1000 - FADE)
      }, () => stop(false))
    })
  }, { stop: () => stop(true), cancel: () => stop(false) })
</script>
