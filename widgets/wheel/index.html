<!doctype html>
<meta charset="utf-8">
<title>Spin wheel</title>
<link rel="stylesheet" href="/widgets/base.css">
<style>
  #wheel-box { position: relative; width: 400px; margin: 16px; }
  #pointer { position: absolute; left: 50%; top: -6px; translate: -50%; border: 18px solid transparent; border-top: 32px solid #fff; z-index: 1; }
  #result { text-align: center; min-height: 1.4em; margin-top: 8px; }
</style>
<div id="wheel-box"><div id="pointer"></div><canvas id="wheel" width="400" height="400"></canvas><div id="result"></div></div>
<script type="module">
  import { subscribe, wait } from '/widgets/lib.js'
  const canvas = document.getElementById('wheel')
  const result = document.getElementById('result')

  // Each option's section, as fractions of a turn from the top, clockwise: its size is its share of the weights.
  function sections(options) {
    const weights = options.map((o) => Math.max(0, Number(o.weight) || 0))
    const total = weights.reduce((a, b) => a + b, 0) || 1
    let start = 0
    return weights.map((w) => {
      const section = { start, size: w / total }
      start += section.size
      return section
    })
  }

  function draw(options) {
    const ctx = canvas.getContext('2d')
    const r = 200
    ctx.clearRect(0, 0, 400, 400)
    sections(options).forEach(({ start, size }, i) => {
      if (!size) return
      const a = -Math.PI / 2 + start * 2 * Math.PI, seg = size * 2 * Math.PI
      ctx.beginPath(); ctx.moveTo(r, r); ctx.arc(r, r, r - 4, a, a + seg); ctx.fillStyle = options[i].color; ctx.fill()
      ctx.save(); ctx.translate(r, r); ctx.rotate(a + seg / 2)
      ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = '700 22px system-ui'; ctx.fillText(options[i].label, r - 20, 8)
      ctx.restore()
    })
  }

  let angle = 0, lastSpin = 0, timer
  subscribe(({ config, state }) => {
    const options = config.options
    draw(options)
    document.getElementById('pointer').style.borderTopColor = config.pointerColor
    if (state.winner < 0 || state.at === lastSpin || state.cancelled) return
    lastSpin = state.at
    // Turn so the winner's middle lands under the top pointer, after 5 full turns.
    const { start, size } = sections(options)[state.winner]
    const target = 360 - (start + size / 2) * 360
    angle = angle - (angle % 360) + 360 * 5 + target
    const left = state.at + config.duration * 1000 - Date.now()
    canvas.style.transition = left > 0 ? `transform ${left}ms cubic-bezier(.15, .85, .25, 1)` : 'none'
    canvas.style.transform = `rotate(${angle}deg)`
    result.textContent = ''
    clearTimeout(timer)
    timer = setTimeout(() => (result.textContent = options[state.winner]?.label ?? ''), Math.max(left, 0))
    return wait(left) // finished once the wheel stops
  }, () => {
    // Cancel: the wheel freezes where it is, with no result.
    const [a, b] = new DOMMatrix(getComputedStyle(canvas).transform).toFloat64Array()
    angle = (Math.atan2(b, a) * 180) / Math.PI
    canvas.style.transition = 'none'
    canvas.style.transform = `rotate(${angle}deg)`
    clearTimeout(timer)
    result.textContent = ''
  })
</script>
